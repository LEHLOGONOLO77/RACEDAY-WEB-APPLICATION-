name: CI

on:
  push:
    branches: [ "main", "part-3" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore

      

      - name: Build MVC project
        run: dotnet build RaceDay.Web/RaceDay.Web.csproj --no-restore --configuration Release

      - name: Run tests
        run: dotnet test RaceDay.Api.Tests/RaceDay.Api.Tests.csproj --configuration Release --verbosity normal

  docker:
    runs-on: ubuntu-latest
    needs: build-and-test
    # If your solution is in a subfolder, set the same folder here:
    # defaults:
    #   run:
    #     working-directory: ./RaceDay

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build MVC Docker image
        run: docker build -t raceday-web ./RaceDay.Web
